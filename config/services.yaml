# Services de l'API DR Choco.
parameters:
    # Durées des sessions (voir App\Entity\RefreshToken) :
    # client = 90 jours glissants ; admin = 12 h maximum après la connexion.
    app.refresh.client_ttl_days: 90
    app.refresh.admin_session_hours: 12
    # Fichiers privés (preuves de paiement) : hors du site public, servis par liens signés (P5).
    app.private_media_dir: '%kernel.project_dir%/var/private'
    # Page index.html construite du front (balises de partage des fiches produit, P9). Vide : à la racine du site.
    app.front_index_path: '%env(resolve:FRONT_INDEX_PATH)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $appEnv: '%kernel.environment%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Cloudinary — identique au backend de référence : URL lue depuis .env.local
    App\Service\Media\CloudinaryService:
        arguments:
            $cloudinaryUrl: '%env(CLOUDINARY_URL)%'

    # Enrichissement du JWT — identique au backend de référence
    App\EventListener\JwtCreatedListener:
        tags:
            - name: kernel.event_listener
              event: lexik_jwt_authentication.on_jwt_created
              method: onJwtCreated

    # SMS Twilio — identique au backend de référence
    App\Service\Notification\SmsService:
        arguments:
            $accountSid: '%env(TWILIO_ACCOUNT_SID)%'
            $authToken: '%env(TWILIO_AUTH_TOKEN)%'
            $fromNumber: '%env(TWILIO_FROM_NUMBER)%'
            $adminPhone: '%env(ADMIN_PHONE_NUMBER)%'

    # PawaPay — conservé mais désactivé par défaut (PAWAPAY_ENABLED=0)
    App\Service\Payment\PawapayService:
        arguments:
            $baseUrl: '%env(PAWAPAY_BASE_URL)%'
            $apiToken: '%env(PAWAPAY_API_TOKEN)%'
            $enabled: '%env(bool:PAWAPAY_ENABLED)%'

    App\Service\Auth\RefreshTokenService:
        arguments:
            $clientTtlDays: '%app.refresh.client_ttl_days%'
            $adminSessionHours: '%app.refresh.admin_session_hours%'

when@test:
    parameters:
        app.private_media_dir: '%kernel.project_dir%/var/test-private'
        app.front_index_path: '%kernel.project_dir%/tests/Fixtures/front/index.html'
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\Tests\Probe\:
            resource: '../tests/Probe/'
        # Aucun SMS réel pendant les tests : les codes envoyés sont lisibles par les tests.
        test.otp_sender:
            class: App\Tests\Fake\RecordingOtpSender
            public: true
        App\Auth\OtpSenderInterface: '@test.otp_sender'
        # Aucun message WhatsApp réel pendant les tests : les réponses au client sont enregistrées.
        test.whatsapp_messenger:
            class: App\Tests\Fake\RecordingWhatsappMessenger
            public: true
        App\Auth\Whatsapp\WhatsappMessengerInterface: '@test.whatsapp_messenger'
        # Aucun envoi réel vers Cloudinary pendant les tests (mêmes contrôles de fichier).
        App\Service\Media\CloudinaryService:
            class: App\Tests\Fake\FakeCloudinaryService
            public: true
            arguments:
                $cloudinaryUrl: 'cloudinary://cle:secret@compte-de-test'
        # Aucune notification push réelle pendant les tests : les envois sont enregistrés (réponse choisie par le test).
        test.push_transport:
            class: App\Tests\Fake\RecordingPushTransport
            public: true
        App\Push\PushTransportInterface: '@test.push_transport'
        # Journal d'audit lu par les tests (App\Audit\AuditLog).
        test.audit_handler:
            alias: monolog.handler.audit
            public: true
        # Accès direct aux services encore inutilisés par un contrôleur (tests uniquement).
        test.refresh_token_service:
            alias: App\Service\Auth\RefreshTokenService
            public: true
