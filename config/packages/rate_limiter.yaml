# Limites de débit de l'API (contrat §2.14). Compteurs gardés dans le cache de l'application (fichiers).
framework:
    rate_limiter:
        # POST /client-errors : 20 envois par heure et par adresse IP.
        client_errors:
            policy: sliding_window
            limit: 20
            interval: '60 minutes'

        # POST /auth/otp/request : 30 demandes de code par heure et par adresse IP (en plus des limites par
        # numéro, contrat §4.1). Assez large pour les réseaux mobiles où beaucoup de clients partagent une IP.
        otp_request_ip:
            policy: sliding_window
            limit: 30
            interval: '60 minutes'

        # Écritures d'un client connecté (adresses, profil, favoris, réservations…) : 60 par minute et par compte.
        client_writes:
            policy: sliding_window
            limit: 60
            interval: '1 minute'

        # POST /reservations/{ref}/proof : 20 captures par heure et par compte (fichiers jusqu'à 10 Mo).
        proof_upload:
            policy: sliding_window
            limit: 20
            interval: '60 minutes'

        # POST /push/subscribe : 30 abonnements aux notifications en 10 min par adresse IP (la route accepte aussi le
        # cookie de session, pour le service worker qui renouvelle l'abonnement sans jeton).
        push_subscribe:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'

        # POST /auth/otp/verify : 30 codes faux, expirés ou refusés en 10 min par adresse IP (une connexion réussie
        # ne compte pas). Une seule machine ne peut pas sonder ni verrouiller les numéros des clients à la chaîne.
        otp_verify_ip:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'

        # POST /admin/auth/login : 5 mots de passe faux en 15 min par identifiant (e-mail ou téléphone), puis
        # blocage (« Réessayez dans 15 minutes » côté front) ; 20 en 15 min par adresse IP. Une connexion
        # réussie ne compte pas et remet le compteur de l'identifiant à zéro.
        admin_login_identifier:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        admin_login_ip:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
