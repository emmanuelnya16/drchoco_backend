monolog:
    channels:
        - deprecation
        - client_errors
        - audit
        - whatsapp
    handlers:
        # Connexion par WhatsApp (App\Auth\Whatsapp) : chaque étape (demande, message reçu de Meta, réponse envoyée ou
        # refusée), lisible dans var/log/whatsapp-AAAA-MM-JJ.log, 30 jours, dans tous les environnements. Jamais le code
        # ni le texte des messages ; numéros masqués. Lecture : php bin/console app:whatsapp:journal
        whatsapp:
            type: rotating_file
            path: "%kernel.logs_dir%/whatsapp.log"
            level: info
            max_files: 30
            channels: [whatsapp]
            # « [27/11/2026 10:37:12] INFO : Message texte de +2376****1683 avec la référence V2ZX4A. » (heure du Cameroun)
            formatter: app.whatsapp_log_formatter
            process_psr_3_messages:
                enabled: true
                remove_used_context_fields: true
        # Actions sensibles de l'équipe (App\Audit\AuditLog) : journal dédié, 400 jours, dans tous les environnements.
        audit:
            type: rotating_file
            path: "%kernel.logs_dir%/audit.log"
            level: info
            max_files: 400
            channels: [audit]
            formatter: monolog.formatter.json
        # Erreurs remontées par l'application (POST /client-errors) : journal dédié, 30 jours.
        client_errors:
            type: rotating_file
            path: "%kernel.logs_dir%/client-errors.log"
            level: info
            max_files: 30
            channels: [client_errors]
            formatter: monolog.formatter.json

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!client_errors", "!audit"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!client_errors", "!audit"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!client_errors", "!audit"]
            # Journal d'audit des tests : gardé en mémoire (service test.audit_handler).
            audit:
                type: test
                channels: [audit]
            # Journal WhatsApp des tests : gardé en mémoire (service test.whatsapp_log).
            whatsapp:
                type: test
                channels: [whatsapp]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

# Production (cPanel) : fichier journal tournant, les 14 derniers jours.
when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
                # Jamais les adresses complètes des services de push (http_client), ni les avertissements de versions
                # futures des bibliothèques (deprecation : une ligne par requête, utile seulement en développement).
                channels: ["!client_errors", "!audit", "!deprecation", "!http_client"]
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: info
                max_files: 14
            deprecation:
                type: "null"
                channels: [deprecation]
